<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-labelledby="tc-title tc-desc" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title id="tc-title">Spearman rank correlation with Total cost</title>
<desc id="tc-desc">Tornado chart, 3 inputs ranked by absolute value. Productivity: 0.756; Steel price: 0.519; Weather days: 0.280.</desc>
<rect width="640" height="210" fill="#f5f2eb"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#162b31">Spearman rank correlation with Total cost</text>
<text x="16" y="45" fill="#52656a">n = 2,000 iterations; bars ranked by absolute value</text>
<line x1="190.0" y1="54" x2="190.0" y2="150" stroke="#c3c7bd" stroke-width="1"/>
<text x="190.0" y="166" text-anchor="middle" fill="#52656a">−1.0</text>
<line x1="295.0" y1="54" x2="295.0" y2="150" stroke="#c3c7bd" stroke-width="1"/>
<text x="295.0" y="166" text-anchor="middle" fill="#52656a">−0.5</text>
<line x1="400.0" y1="54" x2="400.0" y2="150" stroke="#c3c7bd" stroke-width="1"/>
<text x="400.0" y="166" text-anchor="middle" fill="#52656a">0.0</text>
<line x1="505.0" y1="54" x2="505.0" y2="150" stroke="#c3c7bd" stroke-width="1"/>
<text x="505.0" y="166" text-anchor="middle" fill="#52656a">0.5</text>
<line x1="610.0" y1="54" x2="610.0" y2="150" stroke="#c3c7bd" stroke-width="1"/>
<text x="610.0" y="166" text-anchor="middle" fill="#52656a">1.0</text>
<line x1="400.0" y1="52" x2="400.0" y2="150" stroke="#162b31" stroke-width="1.5"/>
<text x="180" y="76.5" text-anchor="end" fill="#162b31">Productivity</text>
<rect x="400.0" y="63.0" width="158.8" height="18" fill="#a84d2c"/>
<text x="563.8" y="76.5" text-anchor="start" fill="#162b31">0.76</text>
<text x="180" y="104.5" text-anchor="end" fill="#162b31">Steel price</text>
<rect x="400.0" y="91.0" width="109.0" height="18" fill="#a84d2c"/>
<text x="514.0" y="104.5" text-anchor="start" fill="#162b31">0.52</text>
<text x="180" y="132.5" text-anchor="end" fill="#162b31">Weather days</text>
<rect x="400.0" y="119.0" width="58.8" height="18" fill="#a84d2c"/>
<text x="463.8" y="132.5" text-anchor="start" fill="#162b31">0.28</text>
<text x="400.0" y="186" text-anchor="middle" fill="#162b31">Spearman rank correlation with Total cost</text>
</svg>
