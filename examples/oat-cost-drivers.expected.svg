<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="tc-title tc-desc" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title id="tc-title">One-at-a-time swing of Total installed cost (USD m)</title>
